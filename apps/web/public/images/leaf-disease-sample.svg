<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="leafGrad" cx="40%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="60%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </radialGradient>
    <radialGradient id="lesionGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="40%" stop-color="#78350f" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="90%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#84cc16" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lesionGrad2" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#291102" />
      <stop offset="35%" stop-color="#713f12" />
      <stop offset="65%" stop-color="#b45309" />
      <stop offset="85%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0" />
    </radialGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
  </defs>

  <!-- Background dark organic farm soil backdrop -->
  <rect width="400" height="300" fill="#1b2a21" rx="16" />

  <!-- Main Leaf Shape -->
  <g transform="translate(40, 20) rotate(-5, 160, 130)">
    <!-- Leaf base -->
    <path d="M 20 130 C 50 40, 180 15, 300 130 C 180 245, 50 220, 20 130 Z" fill="url(#leafGrad)" stroke="#15803d" stroke-width="2" />

    <!-- Main central vein -->
    <path d="M 20 130 Q 150 128 300 130" stroke="#86efac" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Lateral veins -->
    <path d="M 70 129 Q 100 80 130 50" stroke="#86efac" stroke-width="1.5" fill="none" opacity="0.6" />
    <path d="M 120 129 Q 155 75 190 45" stroke="#86efac" stroke-width="1.5" fill="none" opacity="0.6" />
    <path d="M 180 130 Q 215 85 245 60" stroke="#86efac" stroke-width="1.5" fill="none" opacity="0.6" />
    
    <path d="M 70 129 Q 100 175 130 205" stroke="#86efac" stroke-width="1.5" fill="none" opacity="0.6" />
    <path d="M 120 130 Q 155 180 190 210" stroke="#86efac" stroke-width="1.5" fill="none" opacity="0.6" />
    <path d="M 180 130 Q 215 170 245 195" stroke="#86efac" stroke-width="1.5" fill="none" opacity="0.6" />

    <!-- Early Blight Concentric Target Lesion 1 -->
    <ellipse cx="140" cy="95" rx="35" ry="28" fill="url(#lesionGrad1)" />
    <!-- Concentric target rings inside lesion -->
    <ellipse cx="140" cy="95" rx="22" ry="17" fill="none" stroke="#451a03" stroke-width="1.5" opacity="0.7" />
    <ellipse cx="140" cy="95" rx="14" ry="10" fill="none" stroke="#291102" stroke-width="1.5" opacity="0.85" />
    <circle cx="140" cy="95" r="5" fill="#1c0a00" />

    <!-- Early Blight Concentric Target Lesion 2 -->
    <ellipse cx="205" cy="155" rx="42" ry="32" fill="url(#lesionGrad2)" />
    <ellipse cx="205" cy="155" rx="26" ry="19" fill="none" stroke="#451a03" stroke-width="1.8" opacity="0.7" />
    <ellipse cx="205" cy="155" rx="15" ry="11" fill="none" stroke="#291102" stroke-width="1.5" opacity="0.85" />
    <circle cx="205" cy="155" r="6" fill="#1c0a00" />

    <!-- Minor secondary lesions -->
    <circle cx="95" cy="150" r="12" fill="url(#lesionGrad1)" opacity="0.8" />
    <circle cx="240" cy="110" r="10" fill="url(#lesionGrad1)" opacity="0.75" />
  </g>
</svg>
